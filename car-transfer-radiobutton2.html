<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>자동차 이전등록 안내</title>

<style>

:root{
    --primary:#0d6efd;
    --danger:#dc3545;
    --success:#198754;
    --gray:#6c757d;
    --light:#f8f9fa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eef3f8;
    font-family:
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
    color:#333;
}

.card{
    max-width:950px;
    margin:0 auto;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h2{
    margin:0;
    text-align:center;
    color:var(--primary);
    font-size:1.9rem;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-top:8px;
    margin-bottom:25px;
}

.notice-banner{
    background:linear-gradient(135deg,#fff8e7,#fff3cd);
    border-left:6px solid #ff6b00;
    border-radius:12px;
    padding:18px;
    font-weight:700;
    line-height:1.6;
    margin-bottom:25px;
}

.section-wrapper{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.section{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
    transition:.2s;
}

.section:hover{
    transform:translateY(-2px);
}

.seller-section{
    border-left:5px solid var(--danger);
}

.buyer-section{
    border-left:5px solid var(--primary);
}

.section-title{
    font-weight:700;
    text-align:center;
    font-size:1rem;
    margin-bottom:15px;
}

.checkbox-group{
    display:flex;
    justify-content:center;
    gap:20px;
}

.checkbox-group{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:15px;
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
}

.checkbox-group input[type="radio"]{
    width:20px;
    height:20px;
    cursor:pointer;
}

.option-card{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:16px;
    padding:20px;
    margin-top:15px;
}

.option-title{
    font-weight:700;
    margin-bottom:12px;
    color:#333;
}

.option-group{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option-group label{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
}

input[type="checkbox"]{
    width:20px;
    height:20px;
}

#result-card{
    margin-top:25px;
    background:linear-gradient(
        135deg,
        #f8fbff,
        #eef6ff
    );
    border:2px solid var(--primary);
    border-radius:16px;
    padding:25px;
}

#result-card h3{
    margin-top:0;
    color:var(--primary);
}

.condition-text{
    background:#fff;
    border-left:4px solid var(--success);
    padding:12px;
    border-radius:8px;
    font-weight:700;
}

#docList{
    list-style:none;
    padding:0;
}

#docList li{
    background:#fff;
    margin-bottom:10px;
    padding:12px;
    border-radius:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
}

.highlight{
    color:var(--danger);
    font-weight:700;
}

.image-section{
    margin-top:40px;
}

.image-section h3{
    margin-bottom:20px;
}

.doc-preview{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:30px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.doc-preview h4{
    margin:0;
    padding:15px;
    background:#f8fafc;
}

.doc-preview img{
    width:100%;
    display:block;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .card{
        padding:20px;
        border-radius:15px;
    }

    .section-wrapper{
        grid-template-columns:1fr;
    }

    .checkbox-group{
        justify-content:center;
        gap:25px;
    }

    .checkbox-group label{
        width:100%;
        max-width:300px;
    }

    h2{
        font-size:1.5rem;
    }
}

</style>
</head>

<body>

<div class="card">

    <h2>🚗 자동차 이전등록(매매·양도) 안내</h2>
    <div class="subtitle">
        자동차 이전등록 전 준비서류를 간편하게 확인하세요.
    </div>

    <div class="notice-banner">
        ⚠️ 중요 안내<br>
        양수인(구매자)이 자동차 보험 가입을 완료한 후 차량 이전등록이 가능합니다.
    </div>

    <div class="section-wrapper">

        <div class="section seller-section">
            <div class="section-title">
                🔴 양도인(구 소유자 · 판매자)
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="radio"
                           name="seller_type"
                           value="personal">
                    개인
                </label>

                <label>
                    <input type="radio"
                           name="seller_type"
                           value="corporate">
                    법인
                </label>
            </div>
        </div>

        <div class="section buyer-section">
            <div class="section-title">
                🔵 양수인(신 소유자 · 구매자)
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="radio"
                           name="buyer_type"
                           value="personal">
                    개인
                </label>

                <label>
                    <input type="radio"
                           name="buyer_type"
                           value="corporate">
                    법인
                </label>
            </div>
        </div>

    </div>

    <div class="option-card">

        <div class="option-title">
            방문하지 못하는 사람을 선택해 주세요.
        </div>

        <div class="option-group">

            <label>
                <input type="checkbox"
                       id="sellerAbsence"
                       onchange="checkDocuments()">
                🔴 양도인(판매자) 미방문
            </label>

            <label>
                <input type="checkbox"
                       id="buyerAbsence"
                       onchange="checkDocuments()">
                🔵 양수인(구매자) 미방문
            </label>

        </div>

    </div>

    <div id="result-card">

        <h3>📄 신청서 작성 및 준비물 안내</h3>

        <p id="conditionNotice"
           class="condition-text"></p>

        <ul id="docList"></ul>

    </div>

    <div class="image-section">

        <h3>📋 신청서 작성 예시</h3>

        <div id="imageContainer"></div>

    </div>

</div>

<script>
function checkDocuments() {
    const isSellerAbsent = document.getElementById("sellerAbsence").checked;
    const isBuyerAbsent = document.getElementById("buyerAbsence").checked;
    const conditionNotice = document.getElementById("conditionNotice");
    const docList = document.getElementById("docList");
    const imageContainer = document.getElementById("imageContainer");

    let conditionText = "";
    let docs = [];
    let images = [];

    if (isSellerAbsent && isBuyerAbsent) {
        conditionText = "📌 양도인, 양수인 모두 대리인이 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 도장이 찍힌 위임장",
			"<span class='highlight'>[필수선택1]</span> 자동차 매도용 인감증명서 + 양도인 도장",
            "<span class='highlight'>[필수선택2]</span> 자동차 매도용 본인서명사실확인서(양도인)",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증 + 도장",
			"<span class='highlight'>[필수]</span> 대리인 신분증",
            "<span class='highlight'>*</span> [필수선택1] 또는 [필수선택2] 중 하나는 반드시 준비해야함."
        ];
        images = [
            { src: "2_trade2.png", title: "이전등록 신청서 (대리인 접수용)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (대리인 접수용)" },
            { src: "10_trade.png", title: "위임장 및 인감증명서 관련 서식" },
            { src: "add_trade.png", title: "추가 구비 서류" }
        ];
    } else if (isSellerAbsent) {
        conditionText = "📌 양수인(구매자)만 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
			"양수인 위임장 작성",
            "<span class='highlight'>[필수선택1]</span> 자동차 매도용 인감증명서 + 양도인 도장",
            "<span class='highlight'>[필수선택2]</span> 자동차 매도용 본인서명사실확인서",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증",
            "<span class='highlight'>*</span> [필수선택1] 또는 [필수선택2] 중 하나는 반드시 준비해야함."
        ];
        images = [
            { src: "2_trade2.png", title: "이전등록 신청서 (양수인(구매자)만 방문한 경우)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (양수인(구매자)만 방문한 경우)" },
            { src: "add_trade.png", title: "자동차 양수자(구매자)의 정보가 기재된 자동차 매도용 인감증명서" }
        ];
    } else if (isBuyerAbsent) {
        conditionText = "📌 양도인(판매자)만 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
			"양수인 위임장 작성",
            "<span class='highlight'>[필수]</span> 양도인(판매자) 신분증",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증 + 도장"
        ];
        images = [
            { src: "2_trade2.png", title: "이전등록 신청서 (양도인(판매자)만 방문한 경우)" },
            { src: "3_trade.png", title: "자동차양도증명서 (양도인(판매자)만 방문한 경우)" },
            { src: "10_trade.png", title: "위임장 서식 (양수인이 양도인에게 위임하는 경우)" }
        ];
    } else {
        // 체크 박스가 둘 다 해제되었을 때 (기본 상태)
        conditionText = "📌 양도인, 양수인 모두 방문 했을 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 양도인(판매자) 신분증",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증",			
        ];
        images = [
            { src: "2_trade2.png", title: "이전등록 신청서(김차량이 강화물에게 자동차 이전등록)" },
            { src: "3_trade.png", title: "자동차양도증명서(김차량이 강화물에게 자동차 이전등록)" }
        ];
    }

    // 조건 문구 출력
    conditionNotice.innerText = conditionText;

    // 문서 목록 출력
    docList.innerHTML = docs.map(doc => `<li>${doc}</li>`).join('');

    // 이미지 목록 출력
    imageContainer.innerHTML = images.map(img => `
        <div class="doc-preview">
            <h4>${img.title}</h4>
            <img src="${img.src}" alt="${img.title}">
        </div>
    `).join('');
}

checkDocuments();
</script>

</body>
</html>
