<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자동차 이전등록</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }

    .section {
      flex: 1 1 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }

    .checkbox-group {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
    }

    label {
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .section {
        flex: 1 1 100%;
      }

      .checkbox-group {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>자동차 이전등록</h1>

    <div class="section-wrapper">
      <!-- 양도인(판매자) -->
      <div class="section">
        <div class="section-title">양도인(판매자)</div>
        <div class="checkbox-group">
          <label>
            <input type="radio" name="seller_type" value="personal" />
            개인
          </label>
          
          <label>
            <input type="radio" name="seller_type" value="corporate" />
            법인
          </label>
        </div>
      </div>

      <!-- 양수인(구매자) -->
      <div class="section">
        <div class="section-title">양수인(구매자)</div>
        <div class="checkbox-group">
          <label>
            <input type="radio" name="buyer_type" value="personal" />
            개인
          </label>
          
          <label>
            <input type="radio" name="buyer_type" value="corporate" />
            법인
          </label>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
