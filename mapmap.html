<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>차량등록사업소 주변 지도</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px; text-align: center;    
  
    }
    #map {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .buttons {
      margin-bottom: 10px; text-align: center;
    }
    .buttons button {
      margin-right: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
  <!-- 네이버 지도 API (Client ID를 실제 값으로 변경하세요) -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s48jyixhzc"></script>
</head>
<body>
  <h1>차량등록사업소 주변 도장 및 출력소 지도</h1>

  <div id="map"></div>

  <div class="buttons">
    <button id="btnSeal">도장가게</button>
    <button id="btnPrint">출력소(프린터)</button>
  </div>

  <script>
    // 차량등록사업소 위치 (예시 좌표: 오산 차량등록사업소 근처로 가정)
    // 실제 좌표로 변경 가능
    var carOfficeLat = 37.1575680;
    var carOfficeLng = 127.0650663;

    // 지도 생성
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(carOfficeLat - 0.0004, carOfficeLng),
      zoom: 18
    });

    // 차량등록사업소 마커
    var carOfficeMarker = new naver.maps.Marker({
      position: new naver.maps.LatLng(carOfficeLat, carOfficeLng),
      map: map,
      title: '차량등록사업소'
    });

    // 도장 가게 데이터 (예시)
    var sealStores = [
      {
        name: '만물열쇠',
        phone: '031-377-1314',
        lat: 37.1581450,
        lng: 127.0647512
      },
      {
        name: '도어마스터 친절열쇠',
        phone: '031-377-1345',
        lat: 37.1588136, 
        lng: 127.0647336
      },
      {
        name: 'OK열쇠',
        phone: '031-373-0070',
        lat: 37.1581854,
        lng: 127.0630929
      },
      {
        name: '땅콩열쇠',
        phone: '031-372-6494',
        lat: 37.1578502,
        lng: 127.0671861
      }
    ];

     

    // 프린트 가게 데이터 (예시)
    var printStores = [
      {
        name: '나단기획',
        phone: '031-372-9897',
        lat: 37.1590842, 
        lng: 127.0646862
      },
      {
        name: '청학도서관',
        phone: '031-8036-6490',
        lat: 37.1562238, 
        lng: 127.0654768
      },
      {
        name: '대학복사',
        phone: '031-372-3109',
        lat: 37.1530751, 
        lng: 127.0629369
      }
    ];

    // 현재 표시 중인 마커들 저장용
    var currentMarkers = [];

    // 마커 모두 제거
    function clearMarkers() {
      for (var i = 0; i < currentMarkers.length; i++) {
        currentMarkers[i].setMap(null);
      }
      currentMarkers = [];
    }

    // 특정 가게 리스트를 지도에 표시
    function showStores(storeList) {
      clearMarkers();

      storeList.forEach(function(store) {
        var marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(store.lat, store.lng),
          map: map,
          title: store.name
        });

        // 정보창 내용
        var contentString = `
          <div style="padding:8px;">
            <strong>${store.name}</strong><br>
            전화번호: ${store.phone}
          </div>
        `;

        var infoWindow = new naver.maps.InfoWindow({
          content: contentString
        });

        // 마커 클릭 시 정보창 표시
        naver.maps.Event.addListener(marker, 'click', function() {
          infoWindow.open(map, marker);
        });

        currentMarkers.push(marker);
      });
    }

    // 버튼 이벤트
    document.getElementById('btnSeal').addEventListener('click', function() {
      showStores(sealStores);
    });

    document.getElementById('btnPrint').addEventListener('click', function() {
      showStores(printStores);
    });
  </script>
</body>
</html>
