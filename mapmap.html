<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>차량등록사업소 주변 지도</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
    }
    #map {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }
    .buttons {
      margin-bottom: 10px;
    }
    .buttons button {
      margin-right: 10px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
  <!-- 네이버 지도 API (Client ID를 실제 값으로 변경하세요) -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s48jyixhzc"></script>
</head>
<body>
  <h1>차량등록사업소 주변 지도</h1>

  <div id="map"></div>

  <div class="buttons">
    <button id="btnSeal">도장 가게</button>
    <button id="btnPrint">프린트</button>
  </div>

  <script>
    // 차량등록사업소 위치 (예시 좌표: 오산 차량등록사업소 근처로 가정)
    // 실제 좌표로 변경 가능
    var carOfficeLat = 37.1495;
    var carOfficeLng = 127.0665;

    // 지도 생성
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(carOfficeLat, carOfficeLng),
      zoom: 16
    });

    // 차량등록사업소 마커
    var carOfficeMarker = new naver.maps.Marker({
      position: new naver.maps.LatLng(carOfficeLat, carOfficeLng),
      map: map,
      title: '차량등록사업소'
    });

    // 도장 가게 데이터 (예시)
    var sealStores = [
      {
        name: '오산도장사',
        phone: '031-111-1111',
        lat: 37.1500,
        lng: 127.0670
      },
      {
        name: '차량등록 인근 도장점',
        phone: '031-222-2222',
        lat: 37.1488,
        lng: 127.0655
      },
      {
        name: '빠른도장센터',
        phone: '031-333-3333',
        lat: 37.1492,
        lng: 127.0680
      }
    ];

    // 프린트 가게 데이터 (예시)
    var printStores = [
      {
        name: '오산프린트샵',
        phone: '031-444-4444',
        lat: 37.1490,
        lng: 127.0648
      },
      {
        name: '출력전문센터',
        phone: '031-555-5555',
        lat: 37.1502,
        lng: 127.0662
      },
      {
        name: '복사·프린트 가게',
        phone: '031-666-6666',
        lat: 37.1485,
        lng: 127.0675
      }
    ];

    // 현재 표시 중인 마커들 저장용
    var currentMarkers = [];

    // 마커 모두 제거
    function clearMarkers() {
      for (var i = 0; i < currentMarkers.length; i++) {
        currentMarkers[i].setMap(null);
      }
      currentMarkers = [];
    }

    // 특정 가게 리스트를 지도에 표시
    function showStores(storeList) {
      clearMarkers();

      storeList.forEach(function(store) {
        var marker = new naver.maps.Marker({
          position: new naver.maps.LatLng(store.lat, store.lng),
          map: map,
          title: store.name
        });

        // 정보창 내용
        var contentString = `
          <div style="padding:8px;">
            <strong>${store.name}</strong><br>
            전화번호: ${store.phone}
          </div>
        `;

        var infoWindow = new naver.maps.InfoWindow({
          content: contentString
        });

        // 마커 클릭 시 정보창 표시
        naver.maps.Event.addListener(marker, 'click', function() {
          infoWindow.open(map, marker);
        });

        currentMarkers.push(marker);
      });
    }

    // 버튼 이벤트
    document.getElementById('btnSeal').addEventListener('click', function() {
      showStores(sealStores);
    });

    document.getElementById('btnPrint').addEventListener('click', function() {
      showStores(printStores);
    });
  </script>
</body>
</html>
