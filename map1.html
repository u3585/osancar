<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>네이버 지도 마커 예제</title>
  <style>
    #map {
      width: 100%;
      height: 500px;
    }
  </style>
  <!-- 네이버 지도 API 불러오기 (본인 Client ID로 변경) -->
  <script src="https://openapi.map.naver.com/openapi/v3/maps.js?ncpClientId=s48jyixhzc"></script>
</head>
<body>
  <h2>네이버 지도 - 마커 클릭 시 가게 정보 표시</h2>
  <div id="map"></div>

  <script>
    // 지도 초기화
    var map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.1575680, 127.0650663), // 오산시 차량등록사업소
      zoom: 16
    });

    // 가게 데이터
    var stores = [
      { name: "궐동열쇠(도장가게)", phone: "031-373-0070", lat: 37.1581854, lng: 127.0630929 },
      { name: "도어마스터(도장가게)", phone: "031-377-1345", lat: 37.1588136, lng: 127.0647336 },
      { name: "만물열쇠(도장가게)", phone: "031-377-1314", lat: 37.1581450, lng: 127.0647512 },
      
    ];

    // 마커와 정보창 생성
    stores.forEach(function(store) {
      var marker = new naver.maps.Marker({
        position: new naver.maps.LatLng(store.lat, store.lng),
        map: map
      });

      var infoWindow = new naver.maps.InfoWindow({
        content: `<div style="padding:10px;">
                    <strong>${store.name}</strong>

                    전화번호: ${store.phone}
                  </div>`
      });

      // 마커 클릭 이벤트
      naver.maps.Event.addListener(marker, "click", function() {
        infoWindow.open(map, marker);
      });
    });
  </script>
</body>
</html>
