<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자동차 이전등록 안내</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 600px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        .option-group { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { width: 18px; height: 18px; }
        #result-box { margin-top: 25px; padding: 15px; background: #e9ecef; border-radius: 8px; }
        ul { margin: 8px 0 0 0; padding-left: 20px; }
        li { margin-bottom: 6px; }
        .highlight { color: #d9534f; font-weight: bold; }
        
        /* 서식 예시 이미지 섹션 스타일 */
        .image-section { margin-top: 35px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .image-section h3 { color: #333; margin-bottom: 15px; }
        .doc-preview { margin-bottom: 25px; text-align: center; }
        .doc-preview h4 { margin-bottom: 8px; color: #555; text-align: left; }
        .doc-preview img { width: 100%; height: auto; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="card">
    <h2>🚗 자동차 이전등록(매매, 양도) 신청서 안내</h2>
    <p>방문하지 못하는 사람을 체크해 주세요.</p>
    
    <div class="option-group">
        <label><input type="checkbox" id="sellerAbsence" onchange="checkDocuments()"> 🔴 양도인(구 소유자, 판매자) 미방문</label>
        <label><input type="checkbox" id="buyerAbsence" onchange="checkDocuments()"> 🔵 양수인(신 소유자, 구매자) 미방문</label>
    </div>

    <div id="result-box">
        <h3>📄 제출해야 하는 신청서</h3>
        <ul id="docList"></ul>
    </div>

    <!-- 문서 양식 예시 이미지 영역 (조건에 따라 동적으로 변경) -->
    <div class="image-section">
        <h3>📋 상황별 제출 서류 양식 예시</h3>
        <div id="imageContainer"></div>
    </div>
</div>

<script>
function checkDocuments() {
    const isSellerAbsent = document.getElementById("sellerAbsence").checked;
    const isBuyerAbsent = document.getElementById("buyerAbsence").checked;
    const docList = document.getElementById("docList");
    const imageContainer = document.getElementById("imageContainer");

    let docs = [];
    let images = [];

    // 조건별 서류 목록 및 이미지 설정
    if (isSellerAbsent && isBuyerAbsent) {
        // 4. 둘 다 미방문 (대리인 접수)
        docs = [
            "이전등록 신청서",
            "자동차양도증명서(양도인, 양수인 직접거래용)",
            "<span class='highlight'>[서류]</span> 양수인(구매자)의 정보가 입력된 자동차 매도용 인감증명서",
            "<span class='highlight'>[확인]</span> 자동차양도증명서에 양도인/양수인 도장 각각 필수",
            "<span class='highlight'>[양수인 관련]</span> 양수인 도장이 찍힌 위임장",
            "<span class='highlight'>[대리인]</span> 방문한 대리인 신분증 지참"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (대리인 접수용)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (대리인 접수용)" },
            { src: "10_trade.png", title: "위임장 및 인감증명서 관련 서식" },
            { src: "add_trade.png", title: "추가 구비 서류" }
        ];
    } else if (isSellerAbsent) {
        // 2. 양도인 미방문 시
        docs = [
            "이전등록 신청서",
            "자동차양도증명서(양도인, 양수인 직접거래용)",
            "<span class='highlight'>[서류]</span> 양수인(구매자)의 정보가 입력된 자동차 매도용 인감증명서",
            "<span class='highlight'>[확인]</span> 자동차양도증명서에 양도인(판매자) 도장 필수",
            "양수인 신분증 지참"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (양도인 미방문용)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (양도인 미방문용)" },
            { src: "add_trade.png", title: "추가 구비 서류" }
        ];
    } else if (isBuyerAbsent) {
        // 3. 양수인 미방문 시
        docs = [
            "이전등록 신청서",
            "자동차양도증명서(양도인, 양수인 직접거래용)",
            "양도인 신분증 지참",
            "<span class='highlight'>[양수인 관련]</span> 양수인 신분증",
            "<span class='highlight'>[양수인 관련]</span> 양수인 도장이 찍힌 위임장"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (양수인 미방문용)" },
            { src: "3_trade.png", title: "자동차양도증명서 (양수인 미방문용)" },
            { src: "10_trade.png", title: "위임장 서식" }
        ];
    } else {
        // 1. 둘 다 방문 (기본)
        docs = [
            "이전등록 신청서",
            "자동차양도증명서(양도인, 양수인 직접거래용)",
            "양도인(판매자) 신분증 지참",
            "양수인(구매자) 신분증 지참",
            "*양수인(구매자) 보험 가입 필수"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서" },
            { src: "3_trade.png", title: "자동차양도증명서" }
        ];
    }

    // 화면에 텍스트 리스트 출력
    docList.innerHTML = docs.map(doc => `<li>${doc}</li>`).join('');

    // 화면에 이미지 리스트 동적 출력
    imageContainer.innerHTML = images.map(img => `
        <div class="doc-preview">
            <h4>${img.title}</h4>
            <img src="${img.src}" alt="${img.title}">
        </div>
    `).join('');
}

// 페이지 로드 시 초기 상태 실행
checkDocuments();
</script>

</body>
</html>
