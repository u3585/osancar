<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비공식 차량등록사업소</title>
    <!-- Tailwind CSS CDN for modern styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 min-h-screen flex flex-col justify-between text-slate-800">

    <header class="w-full py-6 px-4 md:px-8 text-center bg-white/80 backdrop-blur-md shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center justify-center space-x-3">
            <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-md">
                <i class="fa-solid fa-car text-xl md:text-2xl"></i>
            </div>
            <h1 class="text-xl md:text-3xl font-bold tracking-tight text-slate-900">오산시민을 위한 비공식 차량등록사업소</h1>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 md:p-8">
        <div class="w-full max-w-4xl mx-auto">
            
            <!-- Title & Subtitle banner -->
            <div class="text-center mb-8 sm:mb-12">
                <h2 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-slate-900 mb-3">
                    원하는 서비스를 선택하세요
                </h2>
                <p class="text-sm sm:text-base text-slate-600 max-w-md mx-auto">
                    필요한 업무를 선택하면 안내 페이지로 이동합니다.
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 md:gap-8">
                
                <!-- Button 1: 자동차 명의이전 -->
                <a href="trade.html" class="group relative bg-white rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col justify-between transform hover:-translate-y-1">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl font-bold group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-right-left"></i>
                        </div>
                        <span class="text-slate-400 group-hover:text-blue-600 transition-colors">
                            <i class="fa-solid fa-arrow-right text-lg"></i>
                        </span>
                    </div>
                    <div>
                        <h3 class="text-lg sm:text-xl font-bold text-slate-900 group-hover:text-blue-600 transition-colors mb-1">
                            자동차 명의이전
                        </h3>
                        <p class="text-xs sm:text-sm text-slate-500">
                            매매, 양도 등으로 인한 차량 소유자 변경 신청
                        </p>
                    </div>
                </a>

                <!-- Button 2: 자동차 공동명의 -->
                <a href="joints.html" class="group relative bg-white rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col justify-between transform hover:-translate-y-1">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl font-bold group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <span class="text-slate-400 group-hover:text-emerald-600 transition-colors">
                            <i class="fa-solid fa-arrow-right text-lg"></i>
                        </span>
                    </div>
                    <div>
                        <h3 class="text-lg sm:text-xl font-bold text-slate-900 group-hover:text-emerald-600 transition-colors mb-1">
                            자동차 공동명의
                        </h3>
                        <p class="text-xs sm:text-sm text-slate-500">
                            공동명의 신청 및 변경 안내
                        </p>
                    </div>
                </a>

                <!-- Button 3: 이륜차(신규, 이전) -->
                <a href="2wheel.html" class="group relative bg-white rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col justify-between transform hover:-translate-y-1">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl font-bold group-hover:bg-amber-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-motorcycle"></i>
                        </div>
                        <span class="text-slate-400 group-hover:text-amber-600 transition-colors">
                            <i class="fa-solid fa-arrow-right text-lg"></i>
                        </span>
                    </div>
                    <div>
                        <h3 class="text-lg sm:text-xl font-bold text-slate-900 group-hover:text-amber-600 transition-colors mb-1">
                            이륜차(신규, 이전)
                        </h3>
                        <p class="text-xs sm:text-sm text-slate-500">
                            이륜차 신규등록 및 명의이전 업무
                        </p>
                    </div>
                </a>

                <!-- Button 4: 재발급(자동차등록증, 번호판) -->
                <a href="re.html" class="group relative bg-white rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all duration-300 border border-slate-100 flex flex-col justify-between transform hover:-translate-y-1">
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-xl font-bold group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <span class="text-slate-400 group-hover:text-purple-600 transition-colors">
                            <i class="fa-solid fa-arrow-right text-lg"></i>
                        </span>
                    </div>
                    <div>
                        <h3 class="text-lg sm:text-xl font-bold text-slate-900 group-hover:text-purple-600 transition-colors mb-1">
                            재발급(자동차등록증, 등록번호판)
                        </h3>
                        <p class="text-xs sm:text-sm text-slate-500">
                            분실, 멸실, 훼손된 차량등록증 재발급 및 오염, 변색, 사고로 인한 등록번호판 재발급 신청
                        </p>
                    </div>
                </a>

            </div>
        </div>
    </main>

    <footer class="w-full py-6 px-4 text-center text-xs text-slate-500 bg-white/50 border-t border-slate-100">
        <p>오산시민이 오산시민을 위해 제작중...<br>All rights reversed.</p>
    </footer>

</body>
</html>
