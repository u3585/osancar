<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>차량등록사업소 주변 지도</title>
</head>
<body>
    <!-- 지도가 표시될 영역 -->
    <div id="map" style="width:100%;height:500px;"></div>

    <!-- 네이버 지도 API 로드 (Client ID와 geocoder 서브모듈 필수) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s48jyixhzc&submodules=geocoder"></script>
    <script>
        // 1. 기본 지도 생성
        var Vehicle Registration Office = new naver.maps.LatLng(37.1575680, 127.0650663),
            map = new naver.maps.Map('map', {
            center: Vehicle Registration Office(0, 500)
            zoom: 17
        }),
        marker = new naver.maps.Marker({
        map: map,
        position: Vehicle Registration Office
    });

var contentString = [
        '<div class="iw_inner">',
        '<h3>오산시 차량등록사업소</h3>',  
        '</div>'
    ].join('');
var infowindow = new naver.maps.InfoWindow({
    content: contentString
});

       



    </script>
</body>
</html>
