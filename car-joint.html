<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 공동명의 신청서 작성 안내</title>
    <style>
        body { 
            font-family: 'Pretendard', 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6; 
        }
        .card { 
            background: white; 
            padding: 20px 15px; 
            border-radius: 0; 
            width: 100%; 
            box-sizing: border-box; 
            box-shadow: none; 
            margin: 0 auto; 
            min-height: 100vh;
        }
        
        @media (min-width: 600px) {
            body {
                padding: 30px;
            }
            .card {
                max-width: 600px;
                border-radius: 12px;
                padding: 25px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                min-height: auto;
            }
        }

        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; font-size: 1.4rem; }
        .form-group { margin: 20px 0; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 15px; cursor: pointer; display: block; font-weight: bold; color: #333; margin-bottom: 4px; }
        select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        
        /* 필요서류 결과 카드 */
        .result-card { background: #edf2ff; border: 1px solid #bac8ff; padding: 20px; border-radius: 8px; margin-top: 25px; }
        .result-card h3 { margin-top: 0; color: #1c7ed6; font-size: 16px; margin-bottom: 10px; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 8px; font-size: 14.5px; }
        .highlight { color: #d9534f; font-weight: bold; }

        /* 신청서 예시 이미지 영역 */
        .image-card { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .image-card h3 { color: #333; font-size: 16px; margin-bottom: 15px; text-align: left; }
        .image-list { display: flex; flex-direction: column; gap: 15px; text-align: center; }
        .preview-image { max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="card">
    <h2>🚘 자동차 공동명의 신청서 안내</h2>
    
    <!-- 1단계: 명의 변경 유형 -->
    <div class="form-group">
        <label for="transferType">1. 명의 변경 유형을 선택하세요.</label>
        <select id="transferType" onchange="updateVisitorOptions()">
            <option value="A_to_AB">단독명의(A) ➔ 공동명의(A+B)</option>
            <option value="AB_to_A">공동명의(A+B) ➔ 단독명의(A)</option>
        </select>
    </div>

    <!-- 2단계: 방문자 구성 -->
    <div class="form-group">
        <label for="visitor">2. 차량등록사업소 방문자를 선택하세요.</label>
        <select id="visitor" onchange="calculateDocs()">
            <!-- JavaScript로 동적 변경됨 -->
        </select>
    </div>

    <!-- 결과 출력 영역 -->
    <div class="result-card">
        <h3>📄 신청서 작성 및 준비물 안내</h3>
        <ul id="docList"></ul>
    </div>

    <!-- 신청서 예시 이미지 영역 -->
    <div class="image-card">
        <h3>📌 신청서 작성 예시</h3>
        <div id="imageList" class="image-list">
            <!-- JavaScript로 조건에 맞는 이미지들이 동적 생성됨 -->
        </div>
    </div>
</div>

<script>
// 방문자 옵션 텍스트 정의
const visitorOptions = {
    A_to_AB: [
        { value: "both", label: "지분 양도인(A)와 지분 양수인(B) 함께 방문" },
        { value: "only_B", label: "지분 양수인(B)만 방문 (A 미방문)" },
        { value: "only_A", label: "지분 양도인(A)만 방문 (B 미방문)" },
        { value: "agent", label: "대리인 방문 (공동명의자 모두 미방문)" }
    ],
    AB_to_A: [
        { value: "both", label: "공동명의자 A와 B 함께 방문" },
        { value: "only_A", label: "지분 양수인(A)만 방문 (B 미방문)" },
        { value: "only_B", label: "지분 양도인(B)만 방문 (A 미방문)" },
        { value: "agent", label: "대리인 방문 (공동명의자 모두 미방문)" }
    ]
};

// [명의변경 유형] + [방문자 조합]에 따른 이미지 매핑 구조
const imageMap = {
    A_to_AB: {
        both: ["2-a-ab.png", "3_a_ab-1.png", "10_a_ab.png"],
        only_B: ["2-a-ab-2.png", "3_a_ab-2.png", "10_a_ab.png", "add_s1.png"],
        only_A: ["2-a-ab.png", "3_a_ab-3.png", "10_a_ab.png", "9.jpg"],
        agent: ["2-a-ab-3.png", "3_a_ab-4.png", "10_a_ab.png", "9-a-ab-2.png","add_s1.png"]
    },
    AB_to_A: {
        both: ["2-ab-a-1.png", "3_ab_a.png"],
        only_A: ["2-ab-a-1.png", "3-ab-a-1.png", "add-s2.png"],
        only_B: ["2-ab-a-1.png", "3_ab_a.png", "9-ab-a.png"],
        agent: ["2-ab-a-1.png", "3-ab-a-1.png", "9-ab-a.png", "add-s2.png"]
    }
};

function updateVisitorOptions() {
    const type = document.getElementById("transferType").value;
    const visitorSelect = document.getElementById("visitor");

    visitorSelect.innerHTML = visitorOptions[type]
        .map(opt => `<option value="${opt.value}">${opt.label}</option>`)
        .join('');
        
    calculateDocs();
}

function calculateDocs() {
    const type = document.getElementById("transferType").value;
    const visitor = document.getElementById("visitor").value;
    const docList = document.getElementById("docList");
    const imageListDiv = document.getElementById("imageList");
    
    const images = (imageMap[type] && imageMap[type][visitor]) ? imageMap[type][visitor] : [];
    imageListDiv.innerHTML = images
        .map(imgSrc => `<img class="preview-image" src="${imgSrc}" alt="신청서 작성 예시">`)
        .join('');

    let docs = [];

    if (type === "A_to_AB") {
        const baseDocs = ["이전등록 신청서 작성", "자동차양도증명서 작성", "자동차 소유권 공동명의 조서 작성"];
        switch (visitor) {
            case "both": docs = [...baseDocs, "<span class='highlight'>[필수]</span> A 신분증", "<span class='highlight'>[필수]</span> B 신분증"]; break;
            case "only_B": docs = [...baseDocs, "<span class='highlight'>[필수]</span> B 신분증", "<span class='highlight'>[필수]</span> A 자동차 매도용 인감증명서", "<span class='highlight'>[필수]</span> A 도장이 찍힌 자동차 양도증명서"]; break;
            case "only_A": docs = [...baseDocs, "위임장 작성", "<span class='highlight'>[필수]</span> A 신분증", "<span class='highlight'>[필수]</span> B 신분증", "<span class='highlight'>[필수]</span> B 도장"]; break;
            case "agent": docs = [...baseDocs, "위임장 작성", "<span class='highlight'>[필수]</span> A 자동차 매도용 인감증명서", "<span class='highlight'>[필수]</span> A 도장이 찍힌 자동차 양도증명서", "<span class='highlight'>[필수]</span> B 신분증", "<span class='highlight'>[필수]</span> B 도장", "<span class='highlight'>[필수]</span>방문한 대리인 신분증"]; break;
        }
    } else if (type === "AB_to_A") {
        const baseDocs = ["자동차 이전등록신청서 작성", "자동차 양도증명서 작성"];
        switch (visitor) {
            case "both": docs = [...baseDocs, "<span class='highlight'>[필수]</span> A 신분증", "<span class='highlight'>[필수]</span> B 신분증"]; break;
            case "only_A": docs = [...baseDocs, "<span class='highlight'>[필수]</span> A 신분증", "<span class='highlight'>[필수]</span> B 자동차 매도용 인감증명서", "<span class='highlight'>[필수]</span> B 도장이 찍힌 자동차 양도증명서"]; break;
            case "only_B": docs = [...baseDocs, "위임장 작성", "<span class='highlight'>[필수]</span> B 신분증", "<span class='highlight'>[필수]</span> A 신분증", "<span class='highlight'>[필수]</span> A 도장"]; break;
            case "agent": docs = [...baseDocs, "<span class='highlight'>[필수]</span> B 자동차 매도용 인감증명서", "<span class='highlight'>[필수]</span> A 도장이 찍힌 자동차 양도증명서", "위임장 작성", "<span class='highlight'>[필수]</span>B 신분증", "B 도장", "방문한 대리인 신분증"]; break;
        }
    }

    docList.innerHTML = docs.map(doc => `<li>${doc}</li>`).join('');
}

updateVisitorOptions();
</script>

</body>
</html>
