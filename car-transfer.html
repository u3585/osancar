<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자동차 이전등록 안내</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f7f6; 
        }
        .card { 
            background: white; 
            padding: 20px 15px; 
            border-radius: 0; 
            width: 100%; 
            box-sizing: border-box; 
            box-shadow: none; 
            margin: 0 auto; 
            min-height: 100vh;
        }
        
        @media (min-width: 600px) {
            body {
                padding: 30px;
            }
            .card {
                max-width: 600px;
                border-radius: 12px;
                padding: 25px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                min-height: auto;
            }
        }

        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px; font-size: 1.4rem; }
        
        /* 양수인 보험 가입 강조 배너 스타일 */
        .notice-banner {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            border-left: 4px solid #d9534f;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .option-group { margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        input[type="checkbox"] { width: 18px; height: 18px; }
        #result-box { margin-top: 25px; padding: 15px; background: #e9ecef; border-radius: 8px; }
        
        /* 조건 설명 문구 스타일 */
        .condition-text {
            margin: 6px 0 12px 0;
            font-weight: bold;
            color: #0056b3;
            font-size: 0.95rem;
        }

        ul { margin: 8px 0 0 0; padding-left: 20px; }
        li { margin-bottom: 6px; font-size: 0.95rem; }
        .highlight { color: #d9534f; font-weight: bold; }
        
        .image-section { margin-top: 35px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .image-section h3 { color: #333; margin-bottom: 15px; font-size: 1.2rem; }
        .doc-preview { margin-bottom: 25px; text-align: center; }
        .doc-preview h4 { margin-bottom: 8px; color: #555; text-align: left; font-size: 1rem; }
        .doc-preview img { width: 100%; height: auto; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="card">
    <h2>🚗 자동차 이전등록(매매, 양도) 안내</h2>
    
    <div class="notice-banner">
        ⚠️ [양수인 보험 가입 후 자동차 이전등록 가능]
    </div>

    <p>방문하지 못하는 사람을 체크해 주세요.</p>
    
    <div class="option-group">
        <label><input type="checkbox" id="sellerAbsence" onchange="checkDocuments()"> 🔴 양도인(구 소유자, 판매자) 미방문</label>
        <label><input type="checkbox" id="buyerAbsence" onchange="checkDocuments()"> 🔵 양수인(신 소유자, 구매자) 미방문</label>
    </div>

    <div id="result-box">
        <h3>📄 신청서 작성 및 준비물 안내</h3>
        <!-- 조건 설명이 출력될 영역 추가 -->
        <p id="conditionNotice" class="condition-text"></p>
        <ul id="docList"></ul>
    </div>

    <div class="image-section">
        <h3>📋 신청서 작성 예시</h3>
        <div id="imageContainer"></div>
    </div>
</div>

<script>
function checkDocuments() {
    const isSellerAbsent = document.getElementById("sellerAbsence").checked;
    const isBuyerAbsent = document.getElementById("buyerAbsence").checked;
    const conditionNotice = document.getElementById("conditionNotice");
    const docList = document.getElementById("docList");
    const imageContainer = document.getElementById("imageContainer");

    let conditionText = "";
    let docs = [];
    let images = [];

    if (isSellerAbsent && isBuyerAbsent) {
        conditionText = "📌 양도인, 양수인 모두 대리인이 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 자동차 매도용 인감증명서(양도인)",
            "<span class='highlight'>[필수]</span> 자동차양도증명서에 양도인 도장 필수",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 도장이 찍힌 위임장",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증",
            "<span class='highlight'>[필수]</span> 대리인 신분증",
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (대리인 접수용)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (대리인 접수용)" },
            { src: "10_trade.png", title: "위임장 및 인감증명서 관련 서식" },
            { src: "add_trade.png", title: "추가 구비 서류" }
        ];
    } else if (isSellerAbsent) {
        conditionText = "📌 양수인(구매자)만 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 자동차 매도용 인감증명서(양도인)",
            "<span class='highlight'>[필수]</span> 자동차양도증명서에 양도인 도장 필수",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (양수인(구매자)만 방문한 경우)" },
            { src: "3_2_trade.png", title: "자동차양도증명서 (양수인(구매자)만 방문한 경우)" },
            { src: "add_trade.png", title: "자동차 양수자(구매자)의 정보가 기재된 자동차 매도용 인감증명서" }
        ];
    } else if (isBuyerAbsent) {
        conditionText = "📌 양도인(판매자)만 방문한 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 양수인 도장이 찍힌 위임장 작성",
            "<span class='highlight'>[필수]</span> 양도인(판매자) 신분증",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서 (양도인(판매자)만 방문한 경우)" },
            { src: "3_trade.png", title: "자동차양도증명서 (양도인(판매자)만 방문한 경우)" },
            { src: "10_trade.png", title: "위임장 서식 (양수인이 양도인에게 위임하는 경우)" }
        ];
    } else {
        // 체크 박스가 둘 다 해제되었을 때 (기본 상태)
        conditionText = "📌 양도인, 양수인 모두 방문 했을 경우";
        docs = [
            "이전등록 신청서 작성",
            "자동차양도증명서(양도인, 양수인 직접거래용) 작성",
            "<span class='highlight'>[필수]</span> 양도인(판매자) 신분증",
            "<span class='highlight'>[필수]</span> 양수인(구매자) 신분증"
        ];
        images = [
            { src: "2_trade.png", title: "이전등록 신청서(김차량이 강화물에게 자동차 이전등록)" },
            { src: "3_trade.png", title: "자동차양도증명서(김차량이 강화물에게 자동차 이전등록)" }
        ];
    }

    // 조건 문구 출력
    conditionNotice.innerText = conditionText;

    // 문서 목록 출력
    docList.innerHTML = docs.map(doc => `<li>${doc}</li>`).join('');

    // 이미지 목록 출력
    imageContainer.innerHTML = images.map(img => `
        <div class="doc-preview">
            <h4>${img.title}</h4>
            <img src="${img.src}" alt="${img.title}">
        </div>
    `).join('');
}

checkDocuments();
</script>

</body>
</html>
