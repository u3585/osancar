<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응형 카드 상세 표시</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: #fff;
            padding: 15px 20px;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            background: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* 상세 내용 영역 */
        #detail-box {
            margin-top: 30px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 8px;
            display: none; /* 처음에는 숨김 */
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>카드 클릭 상세 보기</h1>
</header>

<div class="container">
    <h2>카드를 클릭하면 아래에 상세 내용이 표시됩니다.</h2>

    <div class="grid">
        <div class="card" onclick="showDetail(1)">
            <h3>카드 1</h3>
            <p>카드 1의 간단한 설명입니다.</p>
        </div>

        <div class="card" onclick="showDetail(2)">
            <h3>카드 2</h3>
            <p>카드 2의 간단한 설명입니다.</p>
        </div>

        <div class="card" onclick="showDetail(3)">
            <h3>카드 3</h3>
            <p>카드 3의 간단한 설명입니다.</p>
        </div>
    </div>

    <!-- 클릭 시 내용이 표시되는 영역 -->
    <div id="detail-box"></div>
</div>

<script>
    function showDetail(id) {
        const detailBox = document.getElementById("detail-box");

        const details = {
            1: "<h2>카드 1 상세 내용</h2><p>여기는 카드 1을 클릭했을 때 표시되는 상세 설명입니다. 원하는 내용을 자유롭게 넣을 수 있습니다.</p>",
            2: "<h2>카드 2 상세 내용</h2><p>카드 2의 상세 정보입니다. 이미지, 표, 버튼 등 다양한 요소를 추가할 수 있습니다.</p>",
            3: "<h2>카드 3 상세 내용</h2><p>카드 3의 상세 설명입니다. 프로젝트 소개, 제품 정보 등 원하는 내용을 넣어보세요.</p>"
        };

        detailBox.innerHTML = details[id];
        detailBox.style.display = "block";
        detailBox.scrollIntoView({ behavior: "smooth" });
    }
</script>

</body>
</html>
