<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>각종 서류 발급 안내</title>
    <style>
       body { 
    font-family: 'Pretendard', 'Segoe UI', sans-serif; 
    margin: 0; 
    padding: 0; 
    background-color: #f8f9fa; 
    line-height: 1.5; 
}
.card { 
    background: white; 
    padding: 20px 15px; 
    border-radius: 0; 
    width: 100%; 
    box-sizing: border-box; 
    box-shadow: none; 
    margin: 0 auto; 
    min-height: 100vh;
}

@media (min-width: 600px) {
    body {
        padding: 30px;
    }
    .card {
        max-width: 600px;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        min-height: auto;
    }
}

h2 { margin-top: 0; color: #111; border-bottom: 2px solid #228be6; padding-bottom: 12px; font-size: 20px; }
.form-group { margin-bottom: 20px; }
label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
select { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 15px; }

/* 필요서류 결과 카드 및 이미지 관련 기존 스타일 유지 */
.result-card { background: #edf2ff; border: 1px solid #bac8ff; padding: 20px; border-radius: 8px; margin-top: 25px; }
.result-card h3 { margin-top: 0; color: #1c7ed6; font-size: 16px; margin-bottom: 10px; }
ul { margin: 0; padding-left: 20px; }
li { margin-bottom: 8px; font-size: 14.5px; }
 .highlight { color: #d9534f; font-weight: bold; }

.image-card { margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
.image-card h3 { color: #333; font-size: 16px; margin-bottom: 15px; text-align: left; }
.image-list { display: flex; flex-direction: column; gap: 15px; text-align: center; }
.preview-image { max-width: 100%; height: auto; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="card">
    <h2>각종 서류 발급 안내</h2>
    
    <!-- 1단계: 변경 유형 -->
    <div class="form-group">
        <label for="transferType">1. 발급 받을 서류를 선택하세요.</label>
        <select id="transferType" onchange="updateVisitorOptions()">
            <option value="R0">자동차등록증 재발급</option>
            <option value="R1">자동차등록원부 등본(초본) 발급 열람 신청서</option>
            <option value="R2">이륜차 사용신고필증</option>
            <option value="R3">이륜차 폐지증명서</option>
            <option value="R4">이륜차 열람대장</option>
        </select>
    </div>

    <!-- 2단계: 방문자 구성 -->
    <div class="form-group">
        <label for="visitor">2. 창구 방문자를 선택하세요</label>
        <select id="visitor" onchange="calculateDocs()">
            <!-- JavaScript로 동적 변경됨 -->
        </select>
    </div>

    <!-- 결과 출력 영역 -->
    <div class="result-card">
        <h3>📄 신청서 작성 및 준비물 안내</h3>
        <ul id="docList"></ul>
    </div>

    <!-- 신청서 예시 이미지 영역 -->
    <div class="image-card">
        <h3>📌 신청서 작성 예시</h3>
        <div id="imageList" class="image-list">
            <!-- JavaScript로 조건에 맞는 이미지들이 동적 생성됨 -->
        </div>
    </div>
</div>

<script>
// 방문자 옵션 텍스트 정의
const visitorOptions = {
    R0: [
        { value: "owner", label: "자동차 소유자 방문" },
        { value: "agent", label: "대리인 방문" }
    ],
    R1: [
        { value: "owner", label: "자동차 소유자 방문" },
        { value: "agent", label: "제3자 방문" }
    ],
    R2: [
        { value: "owner", label: "이륜차 소유자 방문" },
        { value: "agent", label: "대리인 방문" }
    ],
    R3: [
        { value: "owner", label: "이륜차 소유자 방문" },
        { value: "agent", label: "대리인 방문" }
    ],
    R4: [
        { value: "owner", label: "이륜차 소유자 방문" },
        { value: "agent", label: "제3자 방문" }
        ]
};

// 신청서 이미지 매핑
const imageMap = {
    R0: {
        owner: ["5.png"],
        agent: ["5_1.png", "5_9.png"]
    },
    R1: {
        owner: ["4.png"],
        agent: ["4-1.png"]
    },
    R2: {
        owner: ["20.png"],
        agent: ["20-1.png", "20-1-9.png"]
    },
    R3: {
        owner: ["21.png"],
        agent: ["21-1.png", "21-1-9.png"]
    },
   R4: {
       owner: ["22.png"],
       agent: ["22-1.png"]
  }
     
};

// 1단계 선택에 따라 방문자 옵션 변경
function updateVisitorOptions() {
    const type = document.getElementById("transferType").value;
    const visitorSelect = document.getElementById("visitor");

    visitorSelect.innerHTML = visitorOptions[type]
        .map(opt => `<option value="${opt.value}">${opt.label}</option>`)
        .join("");

    calculateDocs();
}

// 필요서류 및 이미지 표시
function calculateDocs() {

    const type = document.getElementById("transferType").value;
    const visitor = document.getElementById("visitor").value;

    const docList = document.getElementById("docList");
    const imageListDiv = document.getElementById("imageList");

    // 이미지 표시
    const images =
        imageMap[type] && imageMap[type][visitor]
            ? imageMap[type][visitor]
            : [];

    imageListDiv.innerHTML = images
        .map(img => `<img class="preview-image" src="${img}" alt="신청서 작성 예시">`)
        .join("");

    let docs = [];

    // R0 자동차등록증 재발급
    if (type === "R0") {

        const baseDocs = ["자동차 등록증 재발급 신청서"];

        switch (visitor) {

            case "owner":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 신분증"
                    ];
                break;

            case "agent":
                docs = [
                    ...baseDocs,
                    "위임장 작성 - 소유자 도장날인(본인서명사실확인서 제출 시 서명 가능)",
                    "<span class='highlight'>[필수]</span> 자동차 소유자 신분증",
                    "<span class='highlight'>[필수]</span> 방문한 대리인 신분증"  
                ];
                break;
        }
    }
    // R1 자동차등록원부
    else if (type === "R1") {

        const baseDocs = ["자동차등록원부 등본(초본) 발급 열람 신청서"];

        switch (visitor) {

            case "owner":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 신분증"
                    ];
                break;

            case "agent":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 방문한 신청인 신분증"
                    
                  
                ];
                break;
        }
    }

    // 이륜차 사용신고필증
    else if (type === "R2") {

        const baseDocs = ["이륜차 사용신고필증"];

        switch (visitor) {

            case "owner":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 신분증 (외국인은 외국인등록증)"
                ];
                break;

            case "agent":
                docs = [
                    ...baseDocs,
                    "위임장 작성 - 소유자 도장날인(본인서명사실확인서 제출 시 서명 가능)",
                    "<span class='highlight'>[필수]</span> 이륜차 소유자 신분증",
                    "<span class='highlight'>[필수]</span> 방문한 대리인 신분증"
                  ];
                break;
        }
    }

    // 이륜차 폐지증명서
    else if (type === "R3") {

        const baseDocs = ["이륜차 폐지증명서"];

        switch (visitor) {

            case "owner":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 신분증"];
                break;

            case "agent":
                docs = [
                    ...baseDocs,
                    "위임장 작성 - 소유자 도장날인(본인서명사실확인서 제출 시 서명 가능)",
                    "<span class='highlight'>[필수]</span> 이륜차 소유자 신분증",
                    "<span class='highlight'>[필수]</span> 방문한 대리인 신분증"
                ];
                break;
        }
    }
  else if (type === "R4") {

        const baseDocs = ["이륜차 열람대장"];

        switch (visitor) {

            case "owner":
                docs = [
                    ...baseDocs,
                    "<span class='highlight'>[필수]</span> 신분증"];
                break;

            case "agent":
                docs = [
                    ...baseDocs,
                  "<span class='highlight'>[필수]</span> 방문한 대리인 신분증"
                ];
                break;
        }
    }

    // 결과 표시
    docList.innerHTML = docs
        .map(doc => `<li>${doc}</li>`)
        .join("");
}

// 최초 실행
updateVisitorOptions();
</script>

</body>
</html>
