<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자동차 이전등록</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-size: 18px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: bold;
    }

    .section-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }

    .section {
      flex: 1 1 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      font-size: 22px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      padding-left: 10px;
    }

    label {
      cursor: pointer;
      font-size: 20px;
    }

    input[type="checkbox"],
    input[type="radio"] {
      transform: scale(1.3);
      margin-right: 8px;
    }

    /* 하단 컨텐츠 영역 */
    #result-box {
      margin-top: 30px;
      padding: 20px;
      border: 2px solid #444;
      border-radius: 10px;
      background: #fafafa;
      font-size: 22px;
      display: none; /* 처음에는 숨김 */
    }

    @media (max-width: 480px) {
      body {
        font-size: 20px;
      }

      h1 {
        font-size: 30px;
      }

      .section-title {
        font-size: 24px;
      }

      label {
        font-size: 22px;
      }

      input[type="checkbox"],
      input[type="radio"] {
        transform: scale(1.5);
      }

      #result-box {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>자동차 이전등록</h1>

    <div class="section-wrapper">
      <!-- 양도인(판매자) -->
      <div class="section">
        <div class="section-title">양도인(판매자)</div>
        <div class="checkbox-group">
          <label>
            <input type="radio" name="seller_type" value="personal" />
            개인
          </label>
          <label>
            <input type="radio" name="seller_type" value="corporate" />
            법인
          </label>
        </div>
      </div>

      <!-- 양수인(구매자) -->
      <div class="section">
        <div class="section-title">양수인(구매자)</div>
        <div class="checkbox-group">
          <label>
            <input type="radio" name="buyer_type" value="personal" />
            개인
          </label>
          <label>
            <input type="radio" name="buyer_type" value="corporate" />
            법인
          </label>
        </div>
      </div>

      <!-- 미방문자 선택 -->
      <div class="section" style="flex: 1 1 100%;">
        <div class="section-title">미방문자를 선택하세요.</div>
        <div class="checkbox-group">
          <label>
            <input type="checkbox" name="not_visit_seller" value="seller_not_visit" />
            양도인(판매자) 미방문
          </label>
          <label>
            <input type="checkbox" name="not_visit_buyer" value="buyer_not_visit" />
            양수인(구매자) 미방문
          </label>
        </div>
      </div>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="result-box"></div>

  </div>

  <script>
    const sellerRadios = document.getElementsByName("seller_type");
    const buyerRadios = document.getElementsByName("buyer_type");
    const notVisitSeller = document.getElementsByName("not_visit_seller")[0];
    const notVisitBuyer = document.getElementsByName("not_visit_buyer")[0];
    const resultBox = document.getElementById("result-box");

    function updateResult() {
      let seller = "";
      let buyer = "";

      sellerRadios.forEach(r => { if (r.checked) seller = r.value; });
      buyerRadios.forEach(r => { if (r.checked) buyer = r.value; });

      const sellerNotVisit = notVisitSeller.checked;
      const buyerNotVisit = notVisitBuyer.checked;

      // 조건 예시: 양도인=개인, 양수인=개인, 미방문자 없음
      if (seller === "personal" && buyer === "personal" && !sellerNotVisit && !buyerNotVisit) {
        resultBox.style.display = "block";
        resultBox.innerHTML = "📌 선택 결과: 양도인과 양수인이 모두 개인이며, 미방문자는 없습니다.";
      } else {
        resultBox.style.display = "none";
      }
    }

    // 모든 입력 요소에 이벤트 연결
    [...sellerRadios, ...buyerRadios, notVisitSeller, notVisitBuyer].forEach(el => {
      el.addEventListener("change", updateResult);
    });
  </script>

</body>
</html>
